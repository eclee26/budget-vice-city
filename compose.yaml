name: budget-vice-city

services:
  game:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${GAME_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

